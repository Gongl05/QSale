<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contraseña actualizada</title><style th:replace="~{email/layout-style :: style}"></style></head>
<body><div class="card">
    <p class="brand"><img th:if="${logoUrl != null}" th:src="${logoUrl}" alt="" width="32" height="32" style="vertical-align:middle;margin-right:8px">Quesale</p>
    <h2>Tu contraseña se actualizó</h2>
    <p>Hola <span th:text="${name}">Ana</span>, el cambio de contraseña de tu cuenta está guardado.</p>
    <p>Cerramos las sesiones anteriores. Inicia sesión con tu nueva contraseña para volver a tus planes.</p>
    <p><a class="action" th:href="${actionUrl}">Ir a Quesale</a></p>
    <p class="muted">Si no hiciste este cambio, solicita recuperar tu cuenta desde la pantalla de acceso.</p>
</div></body></html>
