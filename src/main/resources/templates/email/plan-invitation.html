<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Invitación a un plan</title>
    <style th:replace="~{email/layout-style :: style}"></style>
</head>
<body>
<div class="card">
    <p class="brand">QSale</p>
    <h2>Te invitaron a <span th:text="${planName}">Cena viernes</span></h2>
    <p><strong th:text="${organizerName}">Ana</strong> quiere coordinar este plan contigo.</p>
    <p>Entra a QSale para aceptar la invitación, marcar tu disponibilidad y votar las opciones. También puedes unirte con este código:</p>
    <p class="code" th:text="${inviteCode}">1C36C59D</p>
    <p class="muted">Recibiste este correo porque alguien te invitó a un plan en QSale.</p>
</div>
</body>
</html>
