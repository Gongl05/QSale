spring.application.name=qsale
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:qsale}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:3600000}
jwt.expiration-refresh=${JWT_EXPIRATION_REFRESH:604800000}

admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
mail.from=${MAIL_FROM:QSale <no-reply@qsale.com>}

maps.base-url=${MAPS_BASE_URL:https://api.openrouteservice.org}
maps.api-key=${MAPS_API_KEY:}

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
