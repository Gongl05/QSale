spring.application.name=qsale
plans.time-zone=${PLANS_TIME_ZONE:America/Lima}
server.port=${PORT:8080}
# Dokploy terminates HTTPS and forwards the public address in proxy headers.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:qsale}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:3600000}
jwt.expiration-refresh=${JWT_EXPIRATION_REFRESH:604800000}

admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:QSale <onboarding@resend.dev>}
resend.api-key=${RESEND_API_KEY:}
resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
# Public address of this API, used for the logo in emails (Render sets RENDER_EXTERNAL_URL by itself).
app.public-url=${PUBLIC_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
# Optional: link of the "open QSale" button and an inbox people can write to about their account.
app.web-url=${APP_WEB_URL:}
mail.support-address=${MAIL_SUPPORT:}

maps.base-url=${MAPS_BASE_URL:https://api.openrouteservice.org}
maps.api-key=${MAPS_API_KEY:}

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
