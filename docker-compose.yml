services:
  postgres:
    image: postgres:16-alpine
    container_name: qsale-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: qsale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Back up data from an existing anonymous volume before recreating qsale-db.
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: qsale-mail
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
