name: Frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:web
      - name: Export native bundles
        working-directory: apps/mobile
        run: npx expo export --platform android --platform ios --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
